name: TWS 24/7 Cloud Sentinel

on:
  schedule:
    # Runs in the cloud 24/7/365
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloud Sentinel Price & SL/TP Patrol
        run: |
          echo "Patrolling TWS market positions via Cloud Engine..."
          curl -s -f "https://tws-dashboard-zeta.vercel.app/api/cron/check-price?key=tws_sentinel_2026_secure" || true
          echo "Patrol complete."
